<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Wedding RSVP for Koon Hian & Germaine - 10 October 2026">
  <title>Koon Hian & Germaine — 10.10.2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-lilac: #F0E4FF;
      --bg-rose: #FADADD;
      --bg-cream: #FFF5F7;
      --text-heading: #9B72B0;
      --text-body: #5A4670;
      --accent-rose: #F2D1E0;
      --card-bg: rgba(255, 255, 255, 0.4);
      --card-border: #DCC8F0;
      --shimmer: #E8E0F0;
      --font-script: 'Great Vibes', cursive;
      --font-serif: 'Cormorant Garamond', serif;
      --font-sans: 'Lato', sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-sans);
      color: var(--text-body);
      background: linear-gradient(180deg, var(--bg-lilac) 0%, var(--bg-rose) 50%, var(--bg-cream) 100%);
      background-attachment: fixed;
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.6;
    }

    /* Glassmorphism card */
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 40px;
    }

    /* Section base */
    .section {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      position: relative;
    }

    /* Scroll entrance animation base */
    .fade-in {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.8s ease-out, transform 0.8s ease-out;
    }

    .fade-in.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ---- Stars ---- */
    .stars {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .star {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      animation: twinkle var(--duration) ease-in-out infinite;
      animation-delay: var(--delay);
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.3); }
    }

    /* ---- Floating Particles ---- */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      bottom: -10px;
      left: var(--x);
      width: var(--size);
      height: var(--size);
      background: radial-gradient(circle, rgba(220, 200, 240, 0.8), rgba(242, 209, 224, 0.4));
      border-radius: 50%;
      animation: floatUp var(--duration) linear infinite;
      animation-delay: var(--delay);
    }

    /* ---- Hero Section ---- */
    .hero {
      position: relative;
      z-index: 2;
      text-align: center;
      min-height: 100vh;
    }

    .hero-content {
      position: relative;
      z-index: 2;
    }

    .hero-names {
      font-family: var(--font-script);
      font-size: clamp(2.5rem, 8vw, 5.5rem);
      color: var(--text-heading);
      font-weight: 400;
      line-height: 1.3;
      margin-bottom: 16px;
    }

    .ampersand {
      display: inline-block;
      font-size: 0.7em;
      margin: 0 8px;
      opacity: 0.7;
    }

    .hero-date {
      font-family: var(--font-serif);
      font-size: clamp(1.2rem, 3vw, 1.8rem);
      color: var(--text-body);
      letter-spacing: 6px;
      font-weight: 300;
    }

    /* Scroll indicator */
    .scroll-indicator {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      animation: bounce 2s ease-in-out infinite;
    }

    .scroll-indicator span {
      font-family: var(--font-sans);
      font-size: 0.75rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-heading);
      opacity: 0.6;
    }

    .scroll-chevron {
      width: 20px;
      height: 20px;
      border-right: 2px solid var(--text-heading);
      border-bottom: 2px solid var(--text-heading);
      transform: rotate(45deg);
      opacity: 0.5;
    }

    @keyframes bounce {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(10px); }
    }

    /* ---- Section Titles ---- */
    .section-title {
      font-family: var(--font-script);
      font-size: clamp(1.8rem, 5vw, 3rem);
      color: var(--text-heading);
      text-align: center;
      margin-bottom: 40px;
      font-weight: 400;
    }

    /* ---- Countdown ---- */
    .countdown-section {
      position: relative;
      z-index: 2;
      min-height: auto;
      padding: 80px 20px;
    }

    .countdown {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .countdown-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 120px;
      height: 120px;
      padding: 20px;
    }

    .countdown-number {
      font-family: var(--font-serif);
      font-size: 2.5rem;
      font-weight: 600;
      color: var(--text-heading);
      line-height: 1;
      transition: transform 0.3s ease;
    }

    .countdown-number.pulse {
      transform: scale(1.05);
    }

    .countdown-label {
      font-family: var(--font-sans);
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-body);
      margin-top: 8px;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) translateX(0);
        opacity: 0;
      }
      10% {
        opacity: 0.8;
      }
      90% {
        opacity: 0.6;
      }
      100% {
        transform: translateY(-110vh) translateX(30px);
        opacity: 0;
      }
    }

    /* Accessibility: respect reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <!-- Stars overlay -->
  <div class="stars" id="stars" aria-hidden="true"></div>

  <!-- Floating particles -->
  <div class="particles" aria-hidden="true">
    <div class="particle" style="--x: 10%; --size: 4px; --duration: 12s; --delay: 0s;"></div>
    <div class="particle" style="--x: 20%; --size: 6px; --duration: 16s; --delay: 2s;"></div>
    <div class="particle" style="--x: 35%; --size: 3px; --duration: 10s; --delay: 4s;"></div>
    <div class="particle" style="--x: 45%; --size: 5px; --duration: 14s; --delay: 1s;"></div>
    <div class="particle" style="--x: 55%; --size: 7px; --duration: 18s; --delay: 3s;"></div>
    <div class="particle" style="--x: 65%; --size: 4px; --duration: 11s; --delay: 5s;"></div>
    <div class="particle" style="--x: 75%; --size: 6px; --duration: 15s; --delay: 2.5s;"></div>
    <div class="particle" style="--x: 85%; --size: 3px; --duration: 13s; --delay: 4.5s;"></div>
    <div class="particle" style="--x: 50%; --size: 5px; --duration: 17s; --delay: 1.5s;"></div>
    <div class="particle" style="--x: 30%; --size: 4px; --duration: 19s; --delay: 3.5s;"></div>
    <div class="particle" style="--x: 90%; --size: 6px; --duration: 12s; --delay: 6s;"></div>
    <div class="particle" style="--x: 5%; --size: 5px; --duration: 14s; --delay: 7s;"></div>
    <div class="particle" style="--x: 60%; --size: 3px; --duration: 20s; --delay: 0.5s;"></div>
    <div class="particle" style="--x: 40%; --size: 7px; --duration: 16s; --delay: 5.5s;"></div>
    <div class="particle" style="--x: 15%; --size: 4px; --duration: 11s; --delay: 8s;"></div>
  </div>

  <!-- Section 1: Hero -->
  <section class="section hero" id="hero">
    <div class="hero-content">
      <p class="hero-subtitle" style="font-family: var(--font-serif); font-size: 1.2rem; letter-spacing: 3px; text-transform: uppercase; color: var(--text-heading); margin-bottom: 10px;">Together with their families</p>
      <h1 class="hero-names">Koon Hian <span class="ampersand">&amp;</span> Germaine</h1>
      <p class="hero-date">10 . 10 . 2026</p>
      <p class="hero-venue" style="font-family: var(--font-serif); font-size: 1.1rem; color: var(--text-heading); margin-top: 8px; font-style: italic;">Pan Pacific Orchard</p>
    </div>
    <div class="scroll-indicator" aria-hidden="true">
      <span>Scroll</span>
      <div class="scroll-chevron"></div>
    </div>
  </section>

  <!-- Section 2: Countdown -->
  <section class="section countdown-section" id="countdown">
    <div class="fade-in">
      <h2 class="section-title">Counting Down To Forever</h2>
      <div class="countdown" id="countdown-timer">
        <div class="countdown-item glass-card">
          <span class="countdown-number" id="cd-days">000</span>
          <span class="countdown-label">Days</span>
        </div>
        <div class="countdown-item glass-card">
          <span class="countdown-number" id="cd-hours">00</span>
          <span class="countdown-label">Hours</span>
        </div>
        <div class="countdown-item glass-card">
          <span class="countdown-number" id="cd-minutes">00</span>
          <span class="countdown-label">Minutes</span>
        </div>
        <div class="countdown-item glass-card">
          <span class="countdown-number" id="cd-seconds">00</span>
          <span class="countdown-label">Seconds</span>
        </div>
      </div>
    </div>
  </section>

  <script>
    // ---- Generate twinkling stars ----
    (function generateStars() {
      const container = document.getElementById('stars');
      const count = window.innerWidth < 768 ? 35 : 70;
      for (let i = 0; i < count; i++) {
        const star = document.createElement('div');
        star.classList.add('star');
        const size = Math.random() * 3 + 1;
        star.style.width = size + 'px';
        star.style.height = size + 'px';
        star.style.top = Math.random() * 100 + '%';
        star.style.left = Math.random() * 100 + '%';
        star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
        star.style.setProperty('--delay', (Math.random() * 5) + 's');
        container.appendChild(star);
      }
    })();

    // ---- Countdown Timer ----
    (function startCountdown() {
      const weddingDate = new Date('2026-10-10T18:00:00+08:00').getTime();
      const daysEl = document.getElementById('cd-days');
      const hoursEl = document.getElementById('cd-hours');
      const minutesEl = document.getElementById('cd-minutes');
      const secondsEl = document.getElementById('cd-seconds');

      function update() {
        const now = Date.now();
        const diff = weddingDate - now;

        if (diff <= 0) {
          daysEl.textContent = '0';
          hoursEl.textContent = '0';
          minutesEl.textContent = '0';
          secondsEl.textContent = '0';
          return;
        }

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((diff % (1000 * 60)) / 1000);

        daysEl.textContent = days;
        hoursEl.textContent = String(hours).padStart(2, '0');
        minutesEl.textContent = String(minutes).padStart(2, '0');

        if (secondsEl.textContent !== String(seconds).padStart(2, '0')) {
          secondsEl.textContent = String(seconds).padStart(2, '0');
          secondsEl.classList.add('pulse');
          setTimeout(() => secondsEl.classList.remove('pulse'), 300);
        }
      }

      update();
      setInterval(update, 1000);
    })();
  </script>
</body>
</html>
